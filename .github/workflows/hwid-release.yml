name: hwid-release

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag (empty = latest stable)'
        required: false
      force:
        description: 'Rebuild even if the release exists (replaces it)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hwid-release
  cancel-in-progress: false

env:
  UPSTREAM: chen08209/FlClash
  PATCHES: |
    required patch/profile-request-headers
    required patch/fork-updates
    optional patch/device-identity
    optional patch/ru-services
    optional patch/service-status-count
    optional patch/ru-apps
    optional patch/ru-dns
    optional patch/global-rules-import

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      signed: ${{ steps.pick.outputs.signed }}
      version: ${{ steps.toolchain.outputs.version }}
      flutter: ${{ steps.toolchain.outputs.flutter }}
      go: ${{ steps.toolchain.outputs.go }}
      ndk: ${{ steps.toolchain.outputs.ndk }}
      ca_bundle: ${{ steps.toolchain.outputs.ca_bundle }}
      ca_sha256: ${{ steps.toolchain.outputs.ca_sha256 }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
          HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}
        run: |
          tag="${INPUT_TAG:-$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$tag is not a stable vX.Y.Z tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "signed=$HAS_KEYSTORE" >> "$GITHUB_OUTPUT"
          if [ "$FORCE" != true ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - id: toolchain
        if: steps.pick.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh api "repos/$UPSTREAM/contents/.github/workflows/build.yaml?ref=$TAG" --jq .content | base64 -d > build.yaml
          gh api "repos/$UPSTREAM/contents/pubspec.yaml?ref=$TAG" --jq .content | base64 -d > pubspec.yaml
          committed="$(sed -n 's/^version: .*+\([0-9]*\)$/\1/p' pubspec.yaml)"
          build="$(date -u +%Y%m%d%H)"
          if ((build <= ${committed:-0})); then
            build=$((committed + 1))
          fi
          ca='.jobs.build.steps[] | select(.name == "Fetch CA certificates") | .env'
          {
            echo "version=${TAG#v}+$build"
            echo "flutter=$(yq '.env.FLUTTER_VERSION' build.yaml)"
            echo "go=$(yq '.env.GO_VERSION' build.yaml)"
            echo "ndk=$(yq '.env.NDK_VERSION' build.yaml)"
            echo "ca_bundle=$(yq "$ca.CA_BUNDLE" build.yaml)"
            echo "ca_sha256=$(yq "$ca.CA_BUNDLE_SHA256" build.yaml)"
          } | tee -a "$GITHUB_OUTPUT"
          grep -E '=(null)?$' "$GITHUB_OUTPUT" && { echo "::error::could not read the upstream toolchain"; exit 1; } || true

  prepare:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          submodules: true
          fetch-depth: 0

      - name: Apply patches
        run: |
          git config user.name 'hwid-bot'
          git config user.email 'hwid-bot@users.noreply.github.com'
          git rev-parse HEAD > "$RUNNER_TEMP/base"
          git fetch -q "https://github.com/$UPSTREAM.git" main:upstream-main
          generated='(^|/)generated/|^lib/l10n/l10n(_[a-z_]+)?\.dart$'
          arb='^arb/[^/]+\.arb$'
          # Patches append their strings to the end of the .arb files, so two
          # of them always collide there: merge the keys instead of the lines.
          merge_arb() {
            python3 - "$1" <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          def stage(n):
              r = subprocess.run(['git', 'show', f':{n}:{path}'], capture_output=True, text=True)
              return json.loads(r.stdout) if r.returncode == 0 else {}
          base, ours, theirs = stage(1), stage(2), stage(3)
          for k in base.keys() - theirs.keys():
              ours.pop(k, None)
          for k, v in theirs.items():
              if base.get(k) != v:
                  ours[k] = v
          with open(path, 'w', encoding='utf-8') as f:
              json.dump(ours, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          }
          pick() {
            git cherry-pick "$@" && return 0
            while git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null; do
              conflicted=$(git diff --name-only --diff-filter=U)
              [ -n "$conflicted" ] || return 1
              if grep -vqE "$generated|$arb" <<< "$conflicted"; then
                return 1
              fi
              for f in $(grep -E "$arb" <<< "$conflicted"); do
                echo "::notice::merging keys of $f"
                merge_arb "$f" || return 1
                git add -- "$f"
              done
              conflicted=$(grep -E "$generated" <<< "$conflicted" || true)
              if [ -n "$conflicted" ]; then
                echo "::notice::regenerating instead of merging: $(echo $conflicted)"
                git checkout --theirs -- $conflicted
                git add -- $conflicted
              fi
              GIT_EDITOR=true git cherry-pick --continue || continue
            done
          }
          notes="$RUNNER_TEMP/patches.md"
          : > "$notes"
          while read -r kind branch; do
            [ -n "$branch" ] || continue
            git fetch -q "https://github.com/$GITHUB_REPOSITORY.git" "$branch:p/$branch"
            sha=$(git rev-parse --short "p/$branch")
            before=$(git rev-parse HEAD)
            commits=$(git rev-list --reverse --no-merges --right-only --cherry-pick "HEAD...p/$branch" ^upstream-main)
            if [ -z "$commits" ] || pick $commits; then
              echo "- applied: \`$branch\` @ $sha" >> "$notes"
              continue
            fi
            git cherry-pick --abort 2>/dev/null || true
            git reset -q --hard "$before"
            if [ "$kind" = required ]; then
              echo "::error::required patch $branch does not apply to $TAG"
              exit 1
            fi
            echo "::warning::optional patch $branch skipped: conflicts with $TAG"
            echo "- **skipped (conflict):** \`$branch\` @ $sha" >> "$notes"
          done <<< "$PATCHES"
          cat "$notes"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.check.outputs.flutter }}
          cache: true

      - name: Regenerate code
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git checkout -- pubspec.yaml
          git add -A lib test
          git diff --cached --quiet || git commit -q -m 'chore: regenerate code'
          git diff --binary "$(cat "$RUNNER_TEMP/base")" HEAD > "$RUNNER_TEMP/combined.diff"
          git diff --stat "$(cat "$RUNNER_TEMP/base")" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: patches
          path: |
            ${{ runner.temp }}/combined.diff
            ${{ runner.temp }}/patches.md

  build:
    needs: [check, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-2022
          - platform: linux
            os: ubuntu-22.04
          - platform: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ needs.check.outputs.tag }}
      VERSION: ${{ needs.check.outputs.version }}
      CA_BUNDLE: ${{ needs.check.outputs.ca_bundle }}
      CA_BUNDLE_SHA256: ${{ needs.check.outputs.ca_sha256 }}
    steps:
      - if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: patches
          path: ${{ runner.temp }}/patches

      - name: Apply patches
        run: |
          git apply --binary --cached "$RUNNER_TEMP/patches/combined.diff"
          git checkout -- .
          sed "s/^version: .*/version: $VERSION/" pubspec.yaml > pubspec.yaml.tmp
          mv pubspec.yaml.tmp pubspec.yaml

      - name: Setup Android signing
        if: matrix.platform == 'android' && needs.check.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.check.outputs.go }}
          cache-dependency-path: core/go.sum

      - if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ needs.check.outputs.flutter }}

      - if: matrix.platform == 'android'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ needs.check.outputs.ndk }}
          add-to-path: true
          link-to-sdk: true

      - run: flutter pub get

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: dart tool/package.dart ${{ matrix.platform }} --env stable --tag "$TAG" -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: ./dist

  arch:
    needs: [check, build]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: in

      - name: Package for Arch
        run: |
          deb=$(ls in/*-linux-amd64.deb | head -1)
          ver=${TAG#v}
          useradd -m builder
          install -d -o builder build out
          cp "$deb" build/flclash.deb
          cat > build/PKGBUILD <<EOF
          pkgname=flclash-hwid
          pkgver=${ver//-/_}
          pkgrel=1
          pkgdesc='FlClash with custom subscription request headers'
          arch=(x86_64)
          url='https://github.com/$GITHUB_REPOSITORY'
          license=(GPL-3.0-only)
          provides=(flclash)
          conflicts=(flclash flclash-bin)
          depends=(gtk3 libayatana-appindicator libkeybinder3 libsecret)
          options=(!strip !debug)
          source=(flclash.deb)
          sha256sums=(SKIP)
          package() {
            bsdtar -xf data.tar.* -C "\$pkgdir"
            exe=\$(find "\$pkgdir/opt" -maxdepth 2 -type f -name FlClash | head -1)
            test -n "\$exe"
            install -d "\$pkgdir/usr/bin"
            ln -s "/\${exe#\$pkgdir/}" "\$pkgdir/usr/bin/flclash"
          }
          EOF
          sed -i 's/^          //' build/PKGBUILD
          chown -R builder build
          su builder -c 'cd build && makepkg --nodeps --noconfirm'
          cp build/*.pkg.tar.zst out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: out

  publish:
    needs: [check, build, arch]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.check.outputs.tag }}
      SIGNED: ${{ needs.check.outputs.signed }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: patches
          path: meta

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Upstream \`$UPSTREAM@$TAG\`"
            echo
            cat meta/patches.md
            echo
            if [ "$SIGNED" = true ]; then
              echo "Android: signed with the fork key, package \`com.follow.clash\` (uninstall the official FlClash first)."
            else
              echo "Android: **no release key in secrets** — debug-signed, package \`com.follow.clash.dev\`; installs next to the official app, but every build has a new key, so updates need a reinstall."
            fi
            echo
            echo "Arch: \`sudo pacman -U flclash-hwid-*.pkg.tar.zst\`"
            echo
            echo "Built by $RUN_URL"
          } > notes.md
          cd dist
          rm -f manifest.json ./*SHA256SUMS
          sums="FlClash-${TAG#v}-SHA256SUMS"
          sha256sum * > "../$sums"
          mv "../$sums" .
          cat "$sums"
          gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$TAG" * \
            -R "$GITHUB_REPOSITORY" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "FlClash ${TAG#v} + patches" \
            --notes-file ../notes.md \
            --latest
